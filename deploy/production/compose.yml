services:
  web:
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile
      args:
        PHP_VERSION: ${TELAR_PHP_VERSION:-7.4}
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        install -d -o www-data -g www-data -m 0770 /var/log/telar /var/lib/telar/trabajos_laboratorio || exit 1
        adjuntos_hilos=/var/www/html/fotos/fotosMensaje
        evidencias_caja=/var/www/html/archivos/cierres_caja/evidencias
        firmas_caja=/var/www/html/archivos/cierres_caja/firmas
        for directorio_caja in "$$evidencias_caja" "$$firmas_caja"; do
          mkdir -p "$$directorio_caja" || exit 1
          chgrp www-data "$$directorio_caja" || exit 1
          chmod 2775 "$$directorio_caja" || exit 1
        done
        if mkdir -p "$$adjuntos_hilos" && chgrp www-data "$$adjuntos_hilos" && chmod 2775 "$$adjuntos_hilos"; then
          if su -s /bin/sh www-data -c "php /var/www/html/scripts/verificar_almacenamiento_adjuntos_hilos.php"; then
            echo "[Telar] almacenamiento de adjuntos de Hilos disponible"
          else
            echo "[Telar] ADVERTENCIA: el usuario web no puede escribir adjuntos de Hilos" >&2
          fi
        else
          echo "[Telar] ADVERTENCIA: no se pudo preparar el almacenamiento de adjuntos de Hilos" >&2
        fi
        exec apache2-foreground
    depends_on:
      database:
        condition: service_healthy
    environment:
      TELAR_DB_HOST: database
      TELAR_DB_NAME: ${TELAR_DB_NAME}
      TELAR_DB_USER: ${TELAR_DB_USER}
      TELAR_DB_PASSWORD: ${TELAR_DB_PASSWORD}
      TELAR_ISSABEL_DB_HOST: ${TELAR_ISSABEL_DB_HOST}
      TELAR_ISSABEL_DB_PORT: ${TELAR_ISSABEL_DB_PORT}
      TELAR_ISSABEL_DB_NAME: ${TELAR_ISSABEL_DB_NAME}
      TELAR_ISSABEL_CDR_TABLE: ${TELAR_ISSABEL_CDR_TABLE}
      TELAR_ISSABEL_DB_USER: ${TELAR_ISSABEL_DB_USER}
      TELAR_ISSABEL_DB_PASSWORD: ${TELAR_ISSABEL_DB_PASSWORD}
      TELAR_ISSABEL_DIRECTORY_ENABLED: ${TELAR_ISSABEL_DIRECTORY_ENABLED:-false}
      TELAR_ISSABEL_DIRECTORY_DB_HOST: ${TELAR_ISSABEL_DIRECTORY_DB_HOST:-}
      TELAR_ISSABEL_DIRECTORY_DB_PORT: ${TELAR_ISSABEL_DIRECTORY_DB_PORT:-3306}
      TELAR_ISSABEL_DIRECTORY_DB_NAME: ${TELAR_ISSABEL_DIRECTORY_DB_NAME:-asterisk}
      TELAR_ISSABEL_DIRECTORY_DB_USER: ${TELAR_ISSABEL_DIRECTORY_DB_USER:-}
      TELAR_ISSABEL_DIRECTORY_DB_PASSWORD: ${TELAR_ISSABEL_DIRECTORY_DB_PASSWORD:-}
      TELAR_ISSABEL_DIRECTORY_USERS_TABLE: ${TELAR_ISSABEL_DIRECTORY_USERS_TABLE:-users}
      TELAR_ISSABEL_DIRECTORY_DEVICES_TABLE: ${TELAR_ISSABEL_DIRECTORY_DEVICES_TABLE:-devices}
      TELAR_ISSABEL_DIRECTORY_QUEUES_TABLE: ${TELAR_ISSABEL_DIRECTORY_QUEUES_TABLE:-queues_config}
      TELAR_GOHIGHLEVEL_API_BASE: ${TELAR_GOHIGHLEVEL_API_BASE:-https://services.leadconnectorhq.com}
      TELAR_GOHIGHLEVEL_API_VERSION: ${TELAR_GOHIGHLEVEL_API_VERSION:-2021-07-28}
      TELAR_GOHIGHLEVEL_LOCATION_ID: ${TELAR_GOHIGHLEVEL_LOCATION_ID:-axvRkLhtUCmmbsYeSUXq}
      TELAR_GOHIGHLEVEL_TOKEN_FILE: /run/secrets/gohighlevel_readonly_token
      TELAR_GOHIGHLEVEL_WRITE_ENABLED: ${TELAR_GOHIGHLEVEL_WRITE_ENABLED:-false}
      TELAR_LAB_MEDIA_DIR: /var/lib/telar/trabajos_laboratorio
      TZ: America/Asuncion
    ports:
      - "${TELAR_BIND_IP:-10.220.100.201}:${TELAR_HTTP_PORT:-8080}:80"
      - "${TELAR_BIND_IP:-10.220.100.201}:${TELAR_HTTPS_PORT:-443}:443"
    volumes:
      - ../../:/var/www/html
      - telar_error_logs:/var/log/telar
      - telar_lab_media:/var/lib/telar/trabajos_laboratorio
      - ./certs:/etc/apache2/ssl:ro
      - ./secrets:/run/secrets:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$c=stream_context_create([\"ssl\"=>[\"verify_peer\"=>false,\"verify_peer_name\"=>false]]); $$s=@file_get_contents(\"https://127.0.0.1/GoodVentaAsisCap/system/login.html\", false, $$c); exit($$s === false ? 1 : 0);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  central-telefonica-sync:
    image: production-web:latest
    restart: unless-stopped
    init: true
    command:
      - sh
      - -c
      - |
        interval="$${TELAR_CENTRAL_SYNC_INTERVAL_SECONDS:-300}"
        case "$$interval" in
          ''|*[!0-9]*) interval=300 ;;
        esac
        if [ "$$interval" -lt 60 ]; then interval=300; fi
        trap 'exit 0' TERM INT
        while true; do
          php /var/www/html/scripts/sincronizar_central_telefonica.php
          sleep "$$interval" & wait $$!
        done
    depends_on:
      database:
        condition: service_healthy
    environment:
      TELAR_DB_HOST: database
      TELAR_DB_NAME: ${TELAR_DB_NAME}
      TELAR_DB_USER: ${TELAR_DB_USER}
      TELAR_DB_PASSWORD: ${TELAR_DB_PASSWORD}
      TELAR_ISSABEL_DB_HOST: ${TELAR_ISSABEL_DB_HOST}
      TELAR_ISSABEL_DB_PORT: ${TELAR_ISSABEL_DB_PORT}
      TELAR_ISSABEL_DB_NAME: ${TELAR_ISSABEL_DB_NAME}
      TELAR_ISSABEL_CDR_TABLE: ${TELAR_ISSABEL_CDR_TABLE}
      TELAR_ISSABEL_DB_USER: ${TELAR_ISSABEL_DB_USER}
      TELAR_ISSABEL_DB_PASSWORD: ${TELAR_ISSABEL_DB_PASSWORD}
      TELAR_ISSABEL_DIRECTORY_ENABLED: ${TELAR_ISSABEL_DIRECTORY_ENABLED:-false}
      TELAR_ISSABEL_DIRECTORY_DB_HOST: ${TELAR_ISSABEL_DIRECTORY_DB_HOST:-}
      TELAR_ISSABEL_DIRECTORY_DB_PORT: ${TELAR_ISSABEL_DIRECTORY_DB_PORT:-3306}
      TELAR_ISSABEL_DIRECTORY_DB_NAME: ${TELAR_ISSABEL_DIRECTORY_DB_NAME:-asterisk}
      TELAR_ISSABEL_DIRECTORY_DB_USER: ${TELAR_ISSABEL_DIRECTORY_DB_USER:-}
      TELAR_ISSABEL_DIRECTORY_DB_PASSWORD: ${TELAR_ISSABEL_DIRECTORY_DB_PASSWORD:-}
      TELAR_ISSABEL_DIRECTORY_USERS_TABLE: ${TELAR_ISSABEL_DIRECTORY_USERS_TABLE:-users}
      TELAR_ISSABEL_DIRECTORY_DEVICES_TABLE: ${TELAR_ISSABEL_DIRECTORY_DEVICES_TABLE:-devices}
      TELAR_ISSABEL_DIRECTORY_QUEUES_TABLE: ${TELAR_ISSABEL_DIRECTORY_QUEUES_TABLE:-queues_config}
      TELAR_CENTRAL_SYNC_INTERVAL_SECONDS: ${TELAR_CENTRAL_SYNC_INTERVAL_SECONDS:-300}
      TZ: America/Asuncion
    volumes:
      - ../../:/var/www/html:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  central-telefonica-live:
    image: production-web:latest
    restart: unless-stopped
    init: true
    user: "www-data:www-data"
    command:
      - php
      - /var/www/html/scripts/procesar_central_telefonica_tiempo_real.php
    depends_on:
      database:
        condition: service_healthy
    environment:
      TELAR_DB_HOST: database
      TELAR_DB_NAME: ${TELAR_DB_NAME}
      TELAR_DB_USER: ${TELAR_DB_USER}
      TELAR_DB_PASSWORD: ${TELAR_DB_PASSWORD}
      TELAR_ISSABEL_DB_HOST: ${TELAR_ISSABEL_DB_HOST}
      TELAR_ISSABEL_AMI_HOST: ${TELAR_ISSABEL_AMI_HOST:-10.220.100.230}
      TELAR_ISSABEL_AMI_PORT: ${TELAR_ISSABEL_AMI_PORT:-5038}
      TELAR_ISSABEL_AMI_EVENT_USER: ${TELAR_ISSABEL_AMI_EVENT_USER:-telar_eventos}
      TELAR_ISSABEL_AMI_EVENT_SECRET_FILE: /run/secrets/issabel_ami_event_secret
      TELAR_ISSABEL_AMI_ORIGINATE_USER: ${TELAR_ISSABEL_AMI_ORIGINATE_USER:-telar_origenacion}
      TELAR_ISSABEL_AMI_ORIGINATE_SECRET_FILE: /run/secrets/issabel_ami_originate_secret
      TELAR_ISSABEL_AMI_CHANNEL_TEMPLATE: ${TELAR_ISSABEL_AMI_CHANNEL_TEMPLATE:-Local/{extension}@from-internal/n}
      TELAR_ISSABEL_AMI_OUTBOUND_CONTEXT: ${TELAR_ISSABEL_AMI_OUTBOUND_CONTEXT:-from-internal}
      TELAR_ISSABEL_AMI_NUMBER_MODE: ${TELAR_ISSABEL_AMI_NUMBER_MODE:-local}
      TELAR_ISSABEL_AMI_ORIGINATE_TIMEOUT_MS: ${TELAR_ISSABEL_AMI_ORIGINATE_TIMEOUT_MS:-30000}
      TZ: America/Asuncion
    volumes:
      - ../../:/var/www/html:ro
      - ./secrets:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=0700,uid=33,gid=33
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  central-telefonica-transcription:
    image: production-web:latest
    restart: unless-stopped
    init: true
    user: "www-data:www-data"
    command:
      - sh
      - -c
      - |
        interval="$${TELAR_TRANSCRIPTION_INTERVAL_SECONDS:-10}"
        case "$$interval" in
          ''|*[!0-9]*) interval=10 ;;
        esac
        if [ "$$interval" -lt 5 ]; then interval=10; fi
        trap 'exit 0' TERM INT
        while true; do
          php /var/www/html/scripts/procesar_transcripciones_central_telefonica.php
          sleep "$$interval" & wait $$!
        done
    depends_on:
      database:
        condition: service_healthy
    environment:
      TELAR_DB_HOST: database
      TELAR_DB_NAME: ${TELAR_DB_NAME}
      TELAR_DB_USER: ${TELAR_DB_USER}
      TELAR_DB_PASSWORD: ${TELAR_DB_PASSWORD}
      TELAR_ISSABEL_AUDIO_HOST: ${TELAR_ISSABEL_AUDIO_HOST:-10.220.100.230}
      TELAR_ISSABEL_AUDIO_PORT: ${TELAR_ISSABEL_AUDIO_PORT:-22}
      TELAR_ISSABEL_AUDIO_USER: ${TELAR_ISSABEL_AUDIO_USER:-telar_audio}
      TELAR_ISSABEL_AUDIO_KEY_PATH: /run/secrets/issabel_audio_ssh_key
      TELAR_ISSABEL_AUDIO_KNOWN_HOSTS_PATH: /run/secrets/issabel_known_hosts
      TELAR_ISSABEL_AUDIO_TIMEOUT_SECONDS: ${TELAR_ISSABEL_AUDIO_TIMEOUT_SECONDS:-60}
      TELAR_OPENAI_API_KEY: ${TELAR_OPENAI_API_KEY}
      TELAR_OPENAI_PROJECT: ${TELAR_OPENAI_PROJECT:-}
      TELAR_OPENAI_ORGANIZATION: ${TELAR_OPENAI_ORGANIZATION:-}
      TELAR_OPENAI_TRANSCRIPTION_MODEL: gpt-4o-transcribe-diarize
      TELAR_OPENAI_TIMEOUT_SECONDS: ${TELAR_OPENAI_TIMEOUT_SECONDS:-900}
      TELAR_OPENAI_MAX_AUDIO_BYTES: ${TELAR_OPENAI_MAX_AUDIO_BYTES:-26214400}
      TELAR_OPENAI_INPUT_USD_MILLION: ${TELAR_OPENAI_INPUT_USD_MILLION:-2.50}
      TELAR_OPENAI_OUTPUT_USD_MILLION: ${TELAR_OPENAI_OUTPUT_USD_MILLION:-10.00}
      TELAR_TRANSCRIPTION_INTERVAL_SECONDS: ${TELAR_TRANSCRIPTION_INTERVAL_SECONDS:-10}
      TZ: America/Asuncion
    volumes:
      - ../../:/var/www/html:ro
      - ./secrets:/run/secrets:ro
      - telar_error_logs:/var/log/telar
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=0700,uid=33,gid=33
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  database:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${TELAR_DB_NAME}
      MARIADB_USER: ${TELAR_DB_USER}
      MARIADB_PASSWORD: ${TELAR_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${TELAR_DB_ROOT_PASSWORD}
      TZ: America/Asuncion
    command:
      - --character-set-server=latin1
      - --collation-server=latin1_swedish_ci
      - --max-allowed-packet=256M
    volumes:
      - telar_database:/var/lib/mysql
      - ./mariadb-performance.cnf:/etc/mysql/conf.d/99-telar-performance.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

volumes:
  telar_database:
  telar_error_logs:
  telar_lab_media:
