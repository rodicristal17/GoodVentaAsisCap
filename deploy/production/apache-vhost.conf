<VirtualHost *:80>
    ServerName 10.220.100.201
    Redirect permanent / https://10.220.100.201/
</VirtualHost>

<VirtualHost *:443>
    ServerName 10.220.100.201
    DocumentRoot /var/www/html
    RedirectMatch 302 ^/$ /GoodVentaAsisCap/system/login.html
    Alias /GoodVentaAsisCap/ /var/www/html/

    AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml

    <FilesMatch "\.(css|js|woff2?|ttf|svg|png|jpe?g|webp|ico)$">
        Header set Cache-Control "public, max-age=604800"
    </FilesMatch>

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "(?i)^(\.env|.*\.(sql|log|ini|bak|zip|gz))$">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/telar-error.log
    CustomLog ${APACHE_LOG_DIR}/telar-access.log combined

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/telar.crt
    SSLCertificateKeyFile /etc/apache2/ssl/telar.key
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"
</VirtualHost>
