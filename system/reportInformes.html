	<script>
	 window.onload=function()

		{
			var pagina=localStorage.getItem("reporte");
			var tipo=localStorage.getItem("tipo");
			document.getElementById("divimpr").innerHTML=pagina
			if (pagina && pagina.indexOf("presupuesto-print-page") >= 0) {
				document.body.classList.add("body-presupuesto-print");
				var presupuestoPrintStyle = document.createElement("style");
				presupuestoPrintStyle.innerHTML = "@page{size:A4 landscape;margin:8mm;}@media print{body.body-presupuesto-print{margin:0!important;background:#fff!important;}body.body-presupuesto-print #divimpr{width:100%!important;}}";
				document.head.appendChild(presupuestoPrintStyle);
			}
			if (pagina && pagina.indexOf("caja-print-letter") >= 0) {
				document.body.classList.add("body-caja-print-letter");
				var cajaPrintStyle = document.createElement("style");
				cajaPrintStyle.innerHTML = "@page{size:Letter portrait;margin:7mm;}@media print{body.body-caja-print-letter{margin:0!important;background:#fff!important;}body.body-caja-print-letter #divimpr{width:100%!important;}}";
				document.head.appendChild(cajaPrintStyle);
			}
			if(tipo=="factura" || tipo=='ticket' || tipo=="reporte-carta"){
			
			  window.print();
          
			}

    }

	
	
		function utf8_to_b64( str ) {
  return window.btoa(unescape(encodeURIComponent( str )));
}

function b64_to_utf8( str ) {
  return decodeURIComponent(escape(window.atob( str )));
}
	function obtener_datos(datos)
		{
		
   var loc = datos;
   if (loc.indexOf('?')>0)
   {
   
   var getstring = loc.split('?')[1];
   var GET= getstring.split('&');
   var get ={};
  
   for (var i =0, l = GET.length; i < l;i++)
   {
   var tmp = GET[i].split('=');
   get[tmp[0]]= unescape(decodeURI(tmp[1]));
   
   }
   return get;
   }
	}
	
	function buscar_datos_url_usuario(datos){
		try{
			valores = document.location.href;
		 valores = obtener_datos(valores);
		 var  datos=valores[datos];
		 return datos;
		}catch(error){
		return "";
		}
		 
	}
	
	</script>
